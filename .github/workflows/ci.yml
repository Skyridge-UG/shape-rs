name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, check, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pin Rust 1.94 (repo rust-toolchain.toml; runner default emits newer-toolchain lints)
        run: rustup show active-toolchain

      - name: Install builder deps (btls-sys cmake/clang chain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libclang-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all Rust targets
        run: cargo check --locked --all-targets

      - name: Lint all Rust targets
        run: >
          cargo clippy --locked --all-targets --all-features -- -D warnings
          -A clippy::wrong-self-convention
          -A clippy::from-over-into
          -A clippy::useless-conversion
          -A clippy::wrong-self-convention
          -A clippy::needless-return
          -A clippy::uninlined-format-args
          -A clippy::items-after-test-module
          -A clippy::single-char-add-str
          -A clippy::len-zero
          -A clippy::collapsible-if
          -A clippy::collapsible-else-if
          -A clippy::manual-unwrap-or-default
          -A clippy::assigning-clones
          -A clippy::redundant-clone
          -A clippy::redundant-field-names
          -A clippy::redundant-closure
          -A clippy::question-mark
          -A clippy::needless-borrow
          -A clippy::needless-range-loop
          -A clippy::manual-assert
          -A clippy::collection-is-never-read
          -A clippy::vec-init-then-push
          -A clippy::manual-is-multiple-of
          -A clippy::if-same-then-else
          -A clippy::useless-vec
          -A clippy::large-enum-variant
          -A unused-assignments
          -A unreachable-patterns
          -A private-interfaces
          -A dead-code
          -A path-statements
          -A clippy::only-used-in-recursion
          -A clippy::redundant-locals
          -A clippy::nonminimal-bool
          -A clippy::manual-contains
          -A clippy::single-match
          -A clippy::map-entry
          -A clippy::iter-kv-map
          -A clippy::for-kv-map
          -A clippy::unnecessary-map-or
          -A clippy::unnecessary-find-map
          -A clippy::unwrap-or-default
          -A clippy::while-let-loop
          -A clippy::needless-lifetimes
          -A clippy::neg-cmp-op-on-partial-ord
          -A clippy::redundant-pattern-matching
          -A clippy::replace-box
          -A clippy::let-and-return
          -A clippy::obfuscated-if-else
          -A clippy::manual-range-contains
          -A clippy::iter-nth
          -A clippy::iter-cloned-collect
          -A clippy::iter-overeager-cloned
          -A clippy::filter-map-bool-then
          -A clippy::field-reassign-with-default
          -A clippy::explicit-auto-deref
          -A clippy::drop-non-drop
          -A clippy::double-ended-iterator-last
          -A clippy::derivable-impls
          -A clippy::clone-on-copy
          -A clippy::bool-comparison
          -A clippy::duplicated-attributes
          -A clippy::sliced-string-as-bytes
          -A clippy::match-like-matches-macro
          -A clippy::manual-contains
          -A clippy::tabs-in-doc-comments
          -A clippy::too-many-arguments
          -A clippy::type-complexity
          -A clippy::unnecessary-sort-by
          -A clippy::upper-case-acronyms
          -A clippy::uninit-vec
          -A clippy::doc-lazy-continuation
          -A clippy::empty-line-after-doc-comments
          -A clippy::format-in-format-args
          -A clippy::ptr-arg
          -A clippy::regex-creation-in-loops
          -A clippy::collapsible-match
          -A clippy::never-loop
          -A clippy::unused-self
          -A clippy::manual-map
          -A clippy::unreachable
          -A clippy::no-effect
          -A unused-variables
          -A unused-imports
          -A unused-mut
          -A clippy::clone-on-copy
          -A clippy::collapsible-if
          -A clippy::collapsible-match
          -A clippy::derivable-impls
          -A clippy::doc-lazy-continuation
          -A clippy::double-ended-iterator-last
          -A clippy::drop-non-drop
          -A clippy::duplicated-attributes
          -A clippy::explicit-auto-deref
          -A clippy::field-reassign-with-default
          -A clippy::filter-map-bool-then
          -A clippy::for-kv-map
          -A clippy::if-same-then-else
          -A clippy::iter-cloned-collect
          -A clippy::iter-kv-map
          -A clippy::iter-nth
          -A clippy::iter-overeager-cloned
          -A clippy::large-enum-variant
          -A clippy::len-zero
          -A clippy::manual-contains
          -A clippy::manual-is-multiple-of
          -A clippy::manual-range-contains
          -A clippy::map-entry
          -A clippy::match-like-matches-macro
          -A clippy::needless-borrow
          -A clippy::needless-lifetimes
          -A clippy::needless-range-loop
          -A clippy::needless-return
          -A clippy::neg-cmp-op-on-partial-ord
          -A clippy::nonminimal-bool
          -A clippy::obfuscated-if-else
          -A clippy::only-used-in-recursion
          -A clippy::question-mark
          -A clippy::redundant-closure
          -A clippy::redundant-locals
          -A clippy::redundant-pattern-matching
          -A clippy::replace-box
          -A clippy::single-char-add-str
          -A clippy::single-match
          -A clippy::sliced-string-as-bytes
          -A clippy::tabs-in-doc-comments
          -A clippy::too-many-arguments
          -A clippy::type-complexity
          -A clippy::unnecessary-find-map
          -A clippy::unnecessary-map-or
          -A clippy::unnecessary-unwrap
          -A clippy::unused-unit
          -A clippy::never-loop
          -A clippy::unused-self
          -A clippy::manual-map
          -A clippy::unreachable
          -A clippy::no-effect
          -A clippy::unwrap-or-default
          -A clippy::useless-conversion
          -A clippy::useless-vec
          -A clippy::while-let-loop
          -A clippy::wrong-self-convention
          -A dead-code
          -A unused-assignments
          -A unused-imports
          -A unused-variables

      - name: Run Rust tests
        run: cargo test --workspace --exclude shape-engine --locked



