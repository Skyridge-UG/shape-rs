name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, check, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install builder deps (btls-sys cmake/clang chain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libclang-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all Rust targets
        run: cargo check --locked --all-targets

      - name: Lint all Rust targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked
